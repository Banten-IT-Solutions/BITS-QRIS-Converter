version: 2
updates:
  # NPM dependencies — weekly, grouped, auto-label
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '03:00'
      timezone: 'Asia/Jakarta'
    open-pull-requests-limit: 10
    # Lock TS to 6.x — TS 7 (tsgo) not adopted yet
    ignore:
      - dependency-name: 'typescript'
        versions: ['>=7']
      - dependency-name: 'conventional-changelog-conventionalcommits'
        versions: ['>=9']
    groups:
      dev-dependencies:
        patterns:
          - '@*'
          - 'eslint*'
          - 'prettier*'
          - 'typescript*'
        update-types:
          - 'minor'
          - 'patch'
      prod-dependencies:
        patterns:
          - 'jimp'
          - 'qrcode'
    labels:
      - 'dependencies'
      - 'dependabot'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    reviewers:
      - 'Banten-IT-Solutions'

  # GitHub Actions — weekly
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '03:00'
      timezone: 'Asia/Jakarta'
    labels:
      - 'github-actions'
      - 'dependabot'
    commit-message:
      prefix: 'chore'
      include: 'scope'
