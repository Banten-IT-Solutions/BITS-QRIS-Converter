name: 🏷️ Manual

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 1.0.1) — leave empty to use package.json'
        required: false
        type: string

permissions:
  contents: write
  id-token: write # for npm provenance

jobs:
  publish:
    name: Publish to NPM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Lint & TypeCheck
        run: |
          npm run lint:eslint -- --max-warnings 0
          npm run lint

      - name: Build
        run: npm run build

      - name: Verify before publish
        run: npm pack --dry-run 2>&1 | tail -n 20

      - name: Set version (manual dispatch)
        if: ${{ inputs.version != '' }}
        run: npm version ${{ inputs.version }} --no-git-tag-version

      - name: Publish to NPM (with provenance)
        # NOTE: npm publish requires valid NPM_TOKEN with 2FA bypass or OIDC trusted publisher.
        # For v1.0.0 we keep publish dry-run tolerant to allow GitHub Release creation even if token invalid.
        run: |
          if [ -z "${{ secrets.NPM_TOKEN }}" ]; then
            echo "⚠️ NPM_TOKEN not set — skipping npm publish (GitHub Release only)"
          else
            npm publish --access public || echo "⚠️ npm publish failed (likely OTP/2FA) — continuing to GitHub Release"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        continue-on-error: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
