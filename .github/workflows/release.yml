name: 🏷️ Manual

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 1.0.1) — leave empty to use package.json'
        required: false
        type: string

permissions:
  contents: write
  id-token: write # for npm provenance

jobs:
  publish:
    name: Publish to NPM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Lint & TypeCheck
        run: |
          npm run lint:eslint -- --max-warnings 0
          npm run lint

      - name: Build
        run: npm run build

      - name: Verify before publish
        run: npm pack --dry-run 2>&1 | tail -n 20

      - name: Set version (manual dispatch)
        if: ${{ inputs.version != '' }}
        run: |
          if [ "$(node -p "require('./package.json').version")" = "${{ inputs.version }}" ]; then
            echo "ℹ️ Version already ${{ inputs.version }}, skipping npm version"
          else
            npm version ${{ inputs.version }} --no-git-tag-version
          fi

      - name: Publish to NPM (with provenance via OIDC trusted publisher)
        run: |
          echo "📦 Attempting npm publish with OIDC provenance (no token, uses GitHub OIDC)..."
          # Unset any NPM token to force OIDC flow
          unset NODE_AUTH_TOKEN
          unset NPM_TOKEN
          echo "🔍 Trying OIDC provenance publish..."
          if npm publish --provenance --access public; then
            echo "✅ Published via OIDC provenance"
            exit 0
          fi
          echo "⚠️ OIDC publish failed, trying with NPM_TOKEN fallback..."
          export NODE_AUTH_TOKEN="${{ secrets.NPM_TOKEN }}"
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "❌ No NPM_TOKEN available and OIDC failed — see https://docs.npmjs.com/trusted-publishers"
            echo "ℹ️ Package 'bits-qris' may need trusted publisher configured at https://www.npmjs.com/package/bits-qris/access"
            exit 0
          fi
          npm publish --access public || echo "⚠️ npm publish with token also failed — likely requires OTP/2FA. Please configure trusted publisher or use automation token."
        continue-on-error: true

      - name: Get version for tag
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        # Only create release when triggered by tag push, or when version input creates a tag
        # For workflow_dispatch without tag, skip or create tag first
        if: github.ref_type == 'tag' || inputs.version != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.version.outputs.version) }}
          generate_release_notes: true
          files: |
            dist/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
