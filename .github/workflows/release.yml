name: 🏷️ Manual

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 1.0.1) — leave empty to use package.json'
        required: false
        type: string

permissions:
  contents: write
  id-token: write # for npm provenance

jobs:
  publish:
    name: Publish to NPM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Lint & TypeCheck
        run: |
          npm run lint:eslint -- --max-warnings 0
          npm run lint

      - name: Build
        run: npm run build

      - name: Verify before publish
        run: npm pack --dry-run 2>&1 | tail -n 20

      - name: Set version (manual dispatch)
        if: ${{ inputs.version != '' }}
        run: |
          if [ "$(node -p "require('./package.json').version")" = "${{ inputs.version }}" ]; then
            echo "ℹ️ Version already ${{ inputs.version }}, skipping npm version"
          else
            npm version ${{ inputs.version }} --no-git-tag-version
          fi

      - name: Publish to NPM (with provenance via OIDC trusted publisher)
        run: |
          echo "📦 Attempting npm publish with OIDC provenance..."
          # Try OIDC trusted publisher first (no token needed, uses id-token)
          if npm publish --provenance --access public; then
            echo "✅ Published via OIDC provenance"
          elif [ -n "${{ secrets.NPM_TOKEN }}" ]; then
            echo "⚠️ OIDC publish failed, trying with NPM_TOKEN..."
            npm publish --access public || echo "⚠️ npm publish with token also failed — check 2FA/trusted publisher config"
          else
            echo "⚠️ OIDC publish failed and no NPM_TOKEN — see https://docs.npmjs.com/trusted-publishers"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        continue-on-error: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
