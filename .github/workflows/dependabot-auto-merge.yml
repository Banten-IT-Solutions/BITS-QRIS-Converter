name: 🤖 Dependabot

on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: 🟢 Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: 📦 Install
        run: npm ci

      - name: 🏗️ Build
        run: |
          npm run lint:eslint -- --max-warnings 0
          npm run build
          npx tsc --noEmit

      - name: 🔀 Auto-merge
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
