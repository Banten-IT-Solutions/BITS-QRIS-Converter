name: 🤖 Dependabot

on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      # Tidak ada checkout/install/build di sini: proteksi branch `main` mewajibkan
      # status check "Lint & Typecheck", "Build (Node 24)" dan "Security Audit" dari
      # workflow 🧪 CI (trigger `pull_request`), jadi verifikasi duplik di job ini
      # hanya membuang waktu runner tanpa menambah keamanan.
      - name: 🔀 Auto-merge
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
