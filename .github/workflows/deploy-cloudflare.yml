name: ☁️ Deploy

# Deploy dijalankan SETELAH 🧪 CI selesai sukses di main, memakai artifact build
# dari CI (dist/ + apps/web/dist/) sehingga lib & web tidak di-build ulang.
# Sebelumnya pakai `pull_request`/`push` + `paths:` — `workflow_run` tidak
# mendukung `paths`, jadi guard-nya dihitung di CI lalu dibawa lewat artifact.
on:
  workflow_run:
    workflows: ['🧪 CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read # download artifact dari run CI lain
  deployments: write

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-24.04
    # Hanya deploy bila CI sukses, atau bila dijalankan manual
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 📥 Download artifact
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-dist
          path: .
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Membaca guard path yang dihitung CI. Tanpa file (mis. dispatch manual)
      # atau mode manual -> deploy.
      - name: 🏁 Gate deploy
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ ! -f should-deploy ]; then
            DEPLOY=true
          else
            DEPLOY=$(cat should-deploy)
          fi
          echo "deploy=$DEPLOY" >> "$GITHUB_OUTPUT"
          echo "should-deploy: $DEPLOY"

      - name: 📦 Install
        if: steps.gate.outputs.deploy == 'true'
        run: npm ci

      - name: ☁️ Deploy
        if: steps.gate.outputs.deploy == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          command: deploy --config wrangler.jsonc
          packageManager: npm
