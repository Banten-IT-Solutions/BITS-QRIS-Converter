name: 🧪 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest # ubuntu-latest migrasi ke Ubuntu 26 pada 2026-10-19 — pantau CI pada tanggal itu
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🟢 Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: 📦 Install
        run: npm ci

      - name: 🧹 Lint
        run: npm run lint:eslint -- --max-warnings 0

      - name: ✨ Format
        run: npm run format

      - name: 🔍 Types
        run: npm run lint

  build:
    name: Build (Node 24)
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 dibutuhkan agar gate deploy bisa `git diff` ke commit `before`
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: 🟢 Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: 📦 Install
        run: npm ci

      - name: 🏗️ Build
        run: npm run build

      - name: 🌐 Build web
        run: npm run build --workspace=@bits/web

      # web tsc butuh dist/ (resolve `bits-qris/*`) — makanya di sini, bukan di job Lint
      - name: 🔍 Types web
        run: npm run lint:web

      - name: ✅ Verify
        run: |
          test -f dist/cjs/index.js
          test -f dist/esm/index.js
          test -f dist/esm/package.json
          test -f dist/assets/images/qris-receipt-template.png
          test -f apps/web/dist/client/index.html
          test -f apps/web/dist/client/sw.js
          echo "✅ Build artifacts ok"

      - name: 🖥️ CLI
        run: |
          node ./dist/cjs/cli.js --help
          node ./dist/cjs/cli.js --validate "00020101021126560014ID.CO.QRIS.WWW0115ID10231625260990215ID10231625260995204581253033605802ID5914TOKO BITS JAYA6007JAKARTA61051234563049BBB"

      - name: 🔗 Imports
        run: |
          node -e "const m=require('./dist/cjs/index.js'); if(!m.convertQris) throw new Error('CJS missing')"
          node --input-type=module -e "import('./dist/esm/index.js').then(m=>{if(!m.convertQris) throw new Error('ESM missing')})"

      - name: 🧪 Test
        run: npm test

      - name: 📐 Size
        run: |
          npm pack --dry-run 2>&1 | tail -n 20
          SIZE_KB=$(npm pack --dry-run 2>&1 | grep "package size" | grep -oE "[0-9.]+ kB" | grep -oE "[0-9.]+")
          SIZE_MB=$(echo "$SIZE_KB / 1024" | bc -l 2>/dev/null || echo "0")
          echo "📦 Package size: ${SIZE_KB} kB (~${SIZE_MB} MB)"
          # Warn if > 1MB, fail if > 1.5MB
          if (( $(echo "$SIZE_KB > 1536" | bc -l) )); then
            echo "❌ Package too large > 1.5MB"
            exit 1
          elif (( $(echo "$SIZE_KB > 1100" | bc -l) )); then
            echo "⚠️ Package > 1.1MB, consider optimizing"
          else
            echo "✅ Size OK"
          fi

      # Pengganti `paths:` di workflow deploy — workflow_run tidak mendukung paths,
      # jadi guard-nya dihitung di sini (push event punya `before`) lalu dibawa via artifact.
      - name: 🏁 Hitung gate deploy
        if: github.event_name == 'push'
        run: |
          BEFORE="${{ github.event.before }}"
          HEAD="${{ github.sha }}"

          # Fail-safe: kalau apa pun tidak pasti, anggap perlu deploy —
          # lebih baik deploy percuma daripada deploy terlewat diam-diam.
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "true" > should-deploy
            echo "should-deploy = true (push awal / force-push)"
            exit 0
          fi

          # cat-file -e, bukan rev-parse --verify: yang terakhir mengembalikan
          # rc=0 untuk SHA yang tidak ada (sudah diverifikasi).
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "true" > should-deploy
            echo "should-deploy = true (commit before tidak ditemukan — fail-safe)"
            exit 0
          fi

          CHANGED=$(git diff --name-only "$BEFORE" "$HEAD")
          if echo "$CHANGED" | grep -qE '^(apps/web/|src/|assets/|package\.json$|package-lock\.json$)'; then
            echo "true" > should-deploy
          else
            echo "false" > should-deploy
          fi
          echo "should-deploy = $(cat should-deploy)"

      - name: 📦 Upload artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-dist
          path: |
            dist/
            apps/web/dist/
            should-deploy
          retention-days: 1
          if-no-files-found: error

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🟢 Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      # Dependensi production (yang benar-benar terpublish ke konsumen npm)
      # wajib bebas kerentanan moderate ke atas.
      - name: 🛡️ Audit prod
        run: npm audit --omit=dev --audit-level=moderate

      # Seluruh dependency (termasuk dev) wajib bebas high/critical.
      # moderate pada dev-dep ditoleransi karena ada kerentanan tak-terbaiki di
      # bundled deps `npm` (ip-address@10.5.0, undici@6.28.0) yang tidak bisa
      # di-upgrade bahkan di npm@12.1.0 — hanya dipakai saat publish.
      - name: 🔐 Audit high+
        run: npm audit --audit-level=high
